name: Carpool regression checks

on:
  push:
    branches: [app_v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [mobile, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - if: matrix.directory == 'mobile'
        run: npm run typecheck
      - if: matrix.directory == 'frontend'
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoopr_test
          POSTGRES_USER: hoopr_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoopr_test -d hoopr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/hoopr_test
      TEST_DB_USERNAME: hoopr_test
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode -f backend/pom.xml '-Dtest=*Test,*IT' package
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Exercise the packaged server over HTTP
        env:
          DB_URL: ${{ env.TEST_DB_URL }}
          DB_USERNAME: ${{ env.TEST_DB_USERNAME }}
          DB_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SERVER_PORT: '8082'
        run: |
          java -jar backend/target/hoopr-backend-0.1.0-SNAPSHOT-exec.jar > backend-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8082/api/v1/health; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8082/api/v1/health
          node scripts/smoke-carpool.mjs
