spring:
  application:
    name: hoopr
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hoopr}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      # Bound PostgreSQL row-lock waits before a single busy ride consumes the pool.
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:1500ms}'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hoopr:
  auth:
    jwt-secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:hoopr}
    origins: ${FRONTEND_ORIGINS:http://localhost:5173,https://localhost}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    refresh-lifetime: ${AUTH_REFRESH_LIFETIME:30d}
